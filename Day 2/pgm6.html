<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Feedback Form</h1>

    <form action="/action"></form>   
    <label for="Name">Name : </label>
    <input type="Name"placeholder="Write your name"/><br>
    
    <label for="Email">Email : </label>
    <input type="Email"placeholder="Write your email"/><br>

    <label for="Message"><b>Message:</b></label><br>
    <textarea id="message" name="message" rows="5" cols="40"></textarea><br/>
    
    <label><b>Rate us out of 5:</b></label><br/>
    <input type="radio" > 😌 Bad<br/>
    <input type="radio" > 😁 Okay<br/>
    <input type="radio" > 😊 Good<br/>
    <input type="radio" > 😍 Best<br/>
    <input type="radio" > 🤩 Excellent<br/>

    <input type="submit" value="Send your message!">
    </form>
</body>
</html>
